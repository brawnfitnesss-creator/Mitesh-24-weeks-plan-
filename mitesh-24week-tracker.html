body{background:#090910;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#EEEEF5;height:100vh;height:100dvh;overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:72px}
input,textarea,button{font-family:inherit;outline:none}

input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.4}

.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#22C55E;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:100;white-space:nowrap;pointer-events:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#181823;border-radius:14px;padding:22px;max-width:320px;width:100%}
.prog-bar-wrap{height:4px;background:#2E2E44;border-radius:2px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.sess-card{border-radius:12px;padding:12px;cursor:pointer;display:flex;align-items:center;width:100%;margin-bottom:10px;gap:11px;text-align:left;border-width:1.5px;border-style:solid}
.block-hdr{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:10px 10px 0 0;border-bottom:none}
.block-body{border-top:none;border-radius:0 0 10px 10px;overflow:hidden}
.ex-row{padding:10px 13px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.log-panel{padding:10px 12px;border-top:1px solid #2E2E44}
.set-grid{display:grid;grid-template-columns:34px 1fr 1fr 28px;gap:5px;margin-bottom:5px;align-items:center}
.inp{background:#1F2030;border:1px solid #2E2E44;border-radius:6px;padding:5px 6px;color:#EEEEF5;font-size:11px;text-align:center;width:100%}
.log-row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.bubble{border-radius:50%;border:none;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
.wk-dot{width:7px;height:7px;border-radius:50%}
.stat-card{background:#181823;border-radius:10px;padding:9px 6px;text-align:center}
.sec-hdr{font-size:10px;font-weight:800;color:#6B6B88;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.phase-banner{padding:12px 15px;border-radius:10px;margin-bottom:12px;border-left-width:4px;border-left-style:solid}
</style>
</head>

// ── STATE ─────────────────────────────────────────────────────────
const S={view:'dash',selWeek:1,selSess:null,prog:{},sessNotes:{},
  expandMob:false,expandCool:false,expandedEx:{},
  showReset:false,dateVal:'',toast:null,toastTimer:null};

function save(){try{localStorage.setItem('mitesh-24w',JSON.stringify({prog:S.prog,notes:S.sessNotes}));}catch(e){}}
function load(){try{const d=localStorage.getItem('mitesh-24w');if(d){const p=JSON.parse(d);S.prog=p.prog||{};S.sessNotes=p.notes||{};}}catch(e){}}

function getSess(w,d){return PROG['p'+phaseOf(w)+d];}
function getProgress(w,d){
  const sess=getSess(w,d);if(!sess)return 0;
  const ck=(S.prog[sk(w,d)]||{}).ck||{};
  let tot=0,hit=0;
  sess.blocks.forEach((b,bi)=>b.ex.forEach((ex,ei)=>{
    for(let si=0;si<(ex.s||1);si++){tot++;if(ck[bi+'-'+ei+'-'+si])hit++;}
  }));
  return tot?Math.round((hit/tot)*100):0;
}
function isChecked(w,d,bi,ei,si){return !!((S.prog[sk(w,d)]||{}).ck||{})[bi+'-'+ei+'-'+si];}
function getLog(w,d,bi,ei){return(((S.prog[sk(w,d)]||{}).log||{})[bi+'-'+ei])||{};}
function getSetLog(w,d,bi,ei,si){return(getLog(w,d,bi,ei).sets||[])[si]||{};}
function currentWeek(){return Array.from({length:24},(_,i)=>i+1).find(w=>!['A','B','C'].every(d=>(S.prog[sk(w,d)]||{}).done))||24;}
function doneSessions(){return Object.values(S.prog).filter(p=>p&&p.done).length;}
function exLogType(blk,ex){
  if(blk.wod)return'wod';
  const n=ex.n.toLowerCase(),r=(ex.r||'').toLowerCase();
  if(n.includes('treadmill')||n.includes('cross trainer')||n.includes('sprint')||n.includes('run'))return'cardio';
  if(n.includes("farmer")||n.includes('carry'))return'carry';
  if(r.includes(' s')||r.includes('sec')||n.includes('hold')||n.includes('l-sit')||n.includes('plank')||n.includes('hollow'))return'timed';
  if(n.includes('push-up')||n.includes('burpee')||n.includes('mountain climb')||n.includes('v-up')||n.includes('dead bug')||n.includes('squat')||n.includes('lunge')||n.includes('jump')||n.includes('crawl')||n.includes('walk')||n.includes('flow')||n.includes('pistol')||n.includes('broad')||n.includes('bound')||n.includes('inchworm')||n.includes('scorpion')||n.includes('ape'))return'bw';
  return'lift';
}
function logSummary(le,lt){
  if(!le)return'';
  if(lt==='lift'||lt==='bw'){const p=(le.sets||[]).filter(s=>s&&(s.w||s.r)).map(s=>s.w&&s.r?s.w+'kg×'+s.r:s.r?s.r+'r':s.w+'kg').filter(Boolean);return p.length?'📊 '+p.join(' · '):'';}
  if(lt==='timed'){const p=(le.sets||[]).filter(s=>s&&s.t).map(s=>s.t+'s');return p.length?'📊 '+p.join(' · '):'';}
  if(lt==='cardio'){const p=[];if(le.dist)p.push(le.dist+'m');if(le.time)p.push(le.time);return p.length?'📊 '+p.join(' @ '):'';};
  if(lt==='carry'){const p=(le.sets||[]).filter(s=>s&&(s.w||s.dist)).map(s=>{const a=[];if(s.w)a.push(s.w+'kg');if(s.dist)a.push(s.dist+'m');return a.join('/')}).filter(Boolean);return p.length?'📊 '+p.join(' · '):'';}
  if(lt==='wod'){const p=[];if(le.rounds)p.push(le.rounds+' rds');if(le.time)p.push(le.time);if(le.weight)p.push('@'+le.weight+'kg');return p.length?'📊 '+p.join(' · '):'';};
  return'';
}

function ring(pct,col,sz=52,sw=5){
  const r=(sz-sw*2)/2,cx=sz/2,cy=sz/2,circ=2*Math.PI*r,dash=(pct/100)*circ;
  return`<svg width="${sz}" height="${sz}" style="flex-shrink:0">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2E2E44" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="${pct===100?col:'#EEEEF5'}"
      font-size="${pct===100?11:12}" font-weight="700" font-family="-apple-system,sans-serif">
      ${pct===100?'✓':pct+'%'}</text></svg>`;
}

// ── ACTIONS ───────────────────────────────────────────────────────
window.toggle=function(w,d,bi,ei,si){
  const k=sk(w,d),ck=bi+'-'+ei+'-'+si;
  if(!S.prog[k])S.prog[k]={};if(!S.prog[k].ck)S.prog[k].ck={};
  S.prog[k].ck[ck]=!S.prog[k].ck[ck];save();render();
};
window.updateLog=function(w,d,bi,ei,field,val,si){
  const k=sk(w,d),ek=bi+'-'+ei;
  if(!S.prog[k])S.prog[k]={};if(!S.prog[k].log)S.prog[k].log={};if(!S.prog[k].log[ek])S.prog[k].log[ek]={};
  const e=S.prog[k].log[ek];
  if(si!==undefined&&si!==null){if(!e.sets)e.sets=[];if(!e.sets[si])e.sets[si]={};e.sets[si][field]=val;}
  else e[field]=val;
  save();renderSession();
};
window.markDone=function(w,d){
  const k=sk(w,d);if(!S.prog[k])S.prog[k]={};
  S.prog[k].done=true;S.prog[k].date=S.dateVal||today();
  save();showToast('✅ Session logged!');render();
};
window.unmark=function(w,d){const k=sk(w,d);if(S.prog[k])S.prog[k].done=false;save();render();};
window.confirmReset=function(){S.showReset=true;render();};
window.cancelReset=function(){S.showReset=false;render();};
window.resetSession=function(w,d){
  S.prog[sk(w,d)]={};S.sessNotes[sk(w,d)]='';
  S.showReset=false;S.expandedEx={};save();showToast('🔄 Session reset');render();
};
window.updateDate=function(v){S.dateVal=v;};
window.updateSessNote=function(k,v){S.sessNotes[k]=v;save();};
window.setView=function(v){S.view=v;S.showReset=false;render();};
window.setWeek=function(w){S.selWeek=parseInt(w);render();};
window.openSess=function(w,d){S.selSess={week:parseInt(w),day:d};S.expandedEx={};S.expandMob=false;S.expandCool=false;S.dateVal='';S.showReset=false;S.view='session';render();};
window.toggleEx=function(key){S.expandedEx[key]=!S.expandedEx[key];renderSession();};
window.toggleMob=function(){S.expandMob=!S.expandMob;renderSession();};
window.toggleCool=function(){S.expandCool=!S.expandCool;renderSession();};
window.setPhaseWeek=function(p){S.selWeek=[1,5,9,13,17,21][p-1];render();};

function showToast(msg){S.toast=msg;render();if(S.toastTimer)clearTimeout(S.toastTimer);S.toastTimer=setTimeout(()=>{S.toast=null;render();},2500);}

    </div>
    <input class="inp" style="width:100%;text-align:left" placeholder="Notes..." value="${(le.notes||'').replace(/"/g,'&quot;')}" oninput="updateLog(${w},'${d}',${bi},${ei},'notes',this.value)"/>
  </div>`;
  if(lt==='timed')return`<div class="log-panel" style="background:${C.raise}">
    <div style="font-size:9px;color:${C.muted};font-weight:700;letter-spacing:.5px;margin-bottom:7px">LOG HOLD / TIME</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px">
      ${Array.from({length:ex.s||1},(_,si)=>{
        const sl=getSetLog(w,d,bi,ei,si),done=isChecked(w,d,bi,ei,si);
        return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          <div style="font-size:9px;color:${C.muted}">Set ${si+1}</div>
          <div style="display:flex;gap:4px;align-items:center">
            <input class="inp" style="width:48px" placeholder="s" value="${sl.t||''}" oninput="updateLog(${w},'${d}',${bi},${ei},'t',this.value,${si})"/>
            <span style="font-size:9px;color:${C.muted}">s</span>
            <button class="bubble" onclick="toggle(${w},'${d}',${bi},${ei},${si})" style="width:22px;height:22px;background:${done?col:C.faint}">${done?'✓':''}</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    <input class="inp" style="width:100%;text-align:left" placeholder="Notes..." value="${(le.notes||'').replace(/"/g,'&quot;')}" oninput="updateLog(${w},'${d}',${bi},${ei},'notes',this.value)"/>
  </div>`;
  if(lt==='carry')return`<div class="log-panel" style="background:${C.raise}">
    <div style="font-size:9px;color:${C.muted};font-weight:700;letter-spacing:.5px;margin-bottom:7px">LOG CARRY SETS</div>
    ${Array.from({length:ex.s||1},(_,si)=>{
      const sl=getSetLog(w,d,bi,ei,si),done=isChecked(w,d,bi,ei,si);
      return`<div class="log-row">
        <span style="font-size:10px;color:${C.muted};width:36px;flex-shrink:0">S${si+1}</span>
        <input class="inp" style="width:52px" placeholder="kg" value="${sl.w||''}" oninput="updateLog(${w},'${d}',${bi},${ei},'w',this.value,${si})"/><span style="font-size:9px;color:${C.muted}">kg</span>
        <input class="inp" style="width:46px" placeholder="m" value="${sl.dist||''}" oninput="updateLog(${w},'${d}',${bi},${ei},'dist',this.value,${si})"/><span style="font-size:9px;color:${C.muted}">m</span>
        <button class="bubble" onclick="toggle(${w},'${d}',${bi},${ei},${si})" style="width:24px;height:24px;background:${done?col:C.faint}">${done?'✓':si+1}</button>
      </div>`;
    }).join('')}
    <input class="inp" style="width:100%;text-align:left;margin-top:4px" placeholder="Notes..." value="${(le.notes||'').replace(/"/g,'&quot;')}" oninput="updateLog(${w},'${d}',${bi},${ei},'notes',this.value)"/>
  </div>`;
  // bw or lift
  const isBW=lt==='bw';
  return`<div class="log-panel" style="background:${C.raise}">
    <div style="display:flex;justify-content:space-between;margin-bottom:7px">
      <div style="font-size:9px;color:${C.muted};font-weight:700;letter-spacing:.5px">LOG SETS — Target: ${ex.r}</div>
      ${isBW?`<div style="font-size:9px;color:${C.muted}">bodyweight</div>`:''}
    </div>
    <div class="set-grid" style="margin-bottom:5px">
      <div></div>
      <div style="font-size:9px;color:${C.muted};text-align:center">${isBW?'BW/Notes':'kg'}</div>
      <div style="font-size:9px;color:${C.muted};text-align:center">Reps done</div>
      <div style="font-size:9px;color:${C.muted};text-align:center">✓</div>
    </div>
    ${Array.from({length:ex.s||1},(_,si)=>{
      const sl=getSetLog(w,d,bi,ei,si),done=isChecked(w,d,bi,ei,si);
      return`<div class="set-grid">
        <div style="font-size:10px;color:${done?col:C.muted};font-weight:700">S${si+1}</div>
        <input class="inp" style="border-color:${sl.w?col+'66':C.faint}" placeholder="${isBW?'BW':'kg'}" value="${sl.w||''}" oninput="updateLog(${w},'${d}',${bi},${ei},'w',this.value,${si})"/>
        <input class="inp" style="border-color:${sl.r?col+'66':C.faint}" placeholder="${ex.r}" value="${sl.r||''}" oninput="updateLog(${w},'${d}',${bi},${ei},'r',this.value,${si})"/>
        <button class="bubble" onclick="toggle(${w},'${d}',${bi},${ei},${si})" style="width:26px;height:26px;background:${done?col:C.faint};border:2px solid ${done?col:C.faint}">${done?'✓':''}</button>
      </div>`;
    }).join('')}
    <input class="inp" style="width:100%;text-align:left;margin-top:5px" placeholder="Notes / RPE / feeling..." value="${(le.notes||'').replace(/"/g,'&quot;')}" oninput="updateLog(${w},'${d}',${bi},${ei},'notes',this.value)"/>
  </div>`;
}

// ── SESSION VIEW ──────────────────────────────────────────────────
function renderSession(){
  if(!S.selSess)return;
  const {week:w,day:d}=S.selSess;
  const sess=getSess(w,d);if(!sess)return;
  const col=PC[phaseOf(w)].c,pct=getProgress(w,d),isDone=!!(S.prog[sk(w,d)]||{}).done,sdKey=sk(w,d);

  const blocksHTML=sess.blocks.map((blk,bi)=>{
    const exHTML=blk.ex.map((ex,ei)=>{
      const exKey=bi+'-'+ei,isOpen=!!S.expandedEx[exKey],lt=exLogType(blk,ex);
      const le=getLog(w,d,bi,ei),sm=logSummary(le,lt);
      const allDone=!blk.wod&&Array.from({length:ex.s||1},(_,si)=>isChecked(w,d,bi,ei,si)).every(Boolean);
      return`<div style="border-bottom:${ei<blk.ex.length-1?'1px solid '+C.faint:'none'}">
        <div class="ex-row" onclick="toggleEx('${exKey}')" style="background:${allDone?blk.col+'0A':'transparent'}">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px">
              <div style="font-size:11px;font-weight:700;color:${blk.wod?'#FFB3B3':allDone?blk.col:C.text}">${ex.n}</div>
              ${allDone?'<span>✅</span>':''}
            </div>
            <div style="font-size:10px;font-weight:600;color:${blk.col};margin-top:1px">${!blk.wod?(ex.s||1)+' × '+ex.r:ex.r}</div>
            ${sm?'<div style="font-size:9px;color:'+C.ok+';margin-top:2px;font-weight:600">'+sm+'</div>':''}
            <div style="font-size:9px;color:${C.muted};margin-top:2px;line-height:1.4">${ex.c}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
            <span style="font-size:10px;color:${isOpen?blk.col:C.muted}">${isOpen?'▲ close':'📝 log'}</span>
            ${blk.wod?`<button onclick="event.stopPropagation();toggle(${w},'${d}',${bi},${ei},0)" style="width:30px;height:30px;border-radius:8px;background:${isChecked(w,d,bi,ei,0)?C.wod:C.faint};border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center">${isChecked(w,d,bi,ei,0)?'✅':'☐'}</button>`:''}
          </div>
        </div>
        ${isOpen?logPanelHTML(w,d,bi,ei,ex,blk):''}
      </div>`;
    }).join('');
    return`<div style="margin-bottom:14px">
      <div class="block-hdr" style="background:${blk.col}18;border:1px solid ${blk.col}44;border-bottom:none">
        <span style="font-size:14px">${blk.icon}</span>
        <div>
          <div style="font-size:11px;font-weight:800;color:${blk.col};letter-spacing:.5px">${blk.nm}</div>
          <div style="font-size:9px;color:${C.muted}">${blk.wod?'Log rounds · time · weight':'Tap to log each set'}</div>
        </div>
      </div>
      <div class="block-body" style="background:${blk.wod?C.wod+'09':C.card};border:1px solid ${blk.col}33">${exHTML}</div>
    </div>`;
  }).join('');

  const mobHTML=MOB.map((ex,ei)=>`
    <div style="padding:9px 13px;border-bottom:${ei<MOB.length-1?`1px solid ${C.faint}`:'none'};display:flex;gap:10px;align-items:center">
      <button class="bubble" onclick="toggle(${w},'${d}',-1,${ei},0)" style="width:24px;height:24px;background:${isChecked(w,d,-1,ei,0)?C.mob:C.faint}">${isChecked(w,d,-1,ei,0)?'✓':''}</button>
      <div style="flex:1"><div style="font-size:10px;font-weight:700">${ex.n}</div><div style="font-size:9px;color:${C.muted}">${ex.r} · ${ex.c}</div></div>
    </div>`).join('');

  const html=`<div style="display:flex;flex-direction:column;height:100%">
    <div style="background:${C.surf};border-bottom:1px solid ${C.faint};padding:11px 15px;flex-shrink:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <button onclick="setView('prog')" style="background:none;border:none;color:${C.muted};font-size:12px;cursor:pointer">← Back</button>
        <button onclick="confirmReset()" style="background:none;border:1px solid ${C.danger}55;border-radius:8px;padding:4px 10px;color:${C.danger};font-size:10px;font-weight:600;cursor:pointer">🔄 Reset</button>
      </div>
      <div style="display:flex;align-items:center;gap:11px">
        <div style="flex:1">
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px">
            <span class="chip" style="background:${col}22;color:${col};font-weight:700">WK ${w} · DAY ${d}</span>
            <span class="chip" style="background:${C.wod}22;color:${C.wod};font-weight:700">${sess.wod}</span>
            <span class="chip" style="background:${col}22;color:${col};font-weight:700">${sess.tag||''}</span>
          </div>
          <div style="font-size:16px;font-weight:900;letter-spacing:.5px">${sess.title}</div>
          <div style="font-size:10px;color:${C.muted};margin-top:1px">${sess.sub}</div>
        </div>${ring(isDone?100:pct,col,52)}
      </div>
    </div>
    <div class="scroll" style="padding:12px 15px">
      <div style="background:${C.card};border-radius:10px;padding:10px 13px;margin-bottom:10px;border-left:3px solid ${C.warn}">
        <div style="font-size:10px;font-weight:700;color:${C.warn};margin-bottom:3px">⚡ WARM-UP</div>
        <div style="font-size:10px;color:${C.muted};line-height:1.5">${sess.warmup}</div>
      </div>
      <div style="background:${col}11;border-radius:10px;padding:9px 13px;margin-bottom:12px;border-left:3px solid ${col}">
        <div style="font-size:9px;font-weight:700;color:${col};margin-bottom:2px">💡 COACH NOTE</div>
        <div style="font-size:10px;color:${C.muted};line-height:1.5;font-style:italic">${sess.style}</div>
      </div>
      <button onclick="toggleMob()" style="display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:${S.expandMob?'10px 10px 0 0':'10px'};border:1px solid ${C.mob}44;${S.expandMob?'border-bottom:none;':''}background:${C.mob}18;width:100%;cursor:pointer;margin-bottom:${S.expandMob?0:12}px">
        <span>🧘</span>
        <div style="flex:1;text-align:left"><div style="font-size:11px;font-weight:800;color:${C.mob}">MOBILITY — 5 MIN</div><div style="font-size:9px;color:${C.muted}">Hip + Neck · Every session · Non-negotiable</div></div>
        <span style="color:${C.mob};font-size:13px">${S.expandMob?'▲':'▼'}</span>
      </button>
      ${S.expandMob?`<div style="background:${C.card};border-radius:0 0 10px 10px;margin-bottom:12px;border:1px solid ${C.mob}33;border-top:none">${mobHTML}</div>`:''}
      ${blocksHTML}
      <div style="background:${C.card};border:1px solid ${C.faint};border-radius:10px;padding:12px 13px;margin-bottom:12px">
        <div style="font-size:10px;font-weight:700;color:${C.muted};margin-bottom:6px">📝 SESSION NOTES</div>
        <textarea oninput="updateSessNote('${sdKey}',this.value)" placeholder="How did it feel? PRs? Energy? What to work on..."
          style="width:100%;background:${C.raise};border:1px solid ${C.faint};border-radius:8px;padding:8px 10px;color:${C.text};font-size:11px;resize:vertical;min-height:68px;line-height:1.5">${S.sessNotes[sdKey]||''}</textarea>
      </div>
      <button onclick="toggleCool()" style="display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:${S.expandCool?'10px 10px 0 0':'10px'};border:1px solid ${C.ok}44;${S.expandCool?'border-bottom:none;':''}background:#0D2A1A;width:100%;cursor:pointer;margin-bottom:${S.expandCool?0:12}px">
        <span>🧊</span>
        <div style="flex:1;text-align:left"><div style="font-size:11px;font-weight:800;color:${C.ok}">COOL-DOWN STRETCHES</div><div style="font-size:9px;color:${C.muted}">Hip · Neck · Thoracic — 5 min</div></div>
        <span style="color:${C.ok};font-size:13px">${S.expandCool?'▲':'▼'}</span>
      </button>
      ${S.expandCool?`<div style="background:${C.card};border-radius:0 0 10px 10px;margin-bottom:12px;border:1px solid ${C.ok}33;border-top:none;padding:10px 13px">
        ${sess.cool.map((c,i)=>`<div style="font-size:10px;color:${C.muted};padding:5px 0;border-bottom:${i<sess.cool.length-1?`1px solid ${C.faint}`:'none'}">🌿 ${c}</div>`).join('')}
      </div>`:''}
      ${!isDone?`
        <div style="background:linear-gradient(135deg,${col}18,${C.card});border:1px solid ${col}44;border-radius:12px;padding:14px;margin-bottom:8px">
          <div style="font-size:11px;font-weight:700;color:${col};margin-bottom:10px">✅ MARK SESSION COMPLETE</div>
          <input type="date" onchange="updateDate(this.value)" value="${S.dateVal}"
            style="width:100%;background:${C.raise};border:1px solid ${C.faint};border-radius:8px;padding:8px 10px;color:${C.text};font-size:11px;margin-bottom:10px"/>
          <button onclick="markDone(${w},'${d}')"
            style="width:100%;padding:13px;background:${col};border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.5px">LOG SESSION</button>
          ${pct<100?`<div style="font-size:9px;color:${C.muted};text-align:center;margin-top:7px">${100-pct}% unchecked — you can still log!</div>`:''}
        </div>`:`
        <div style="background:${C.ok}18;border:1px solid ${C.ok}44;border-radius:12px;padding:16px;text-align:center;margin-bottom:8px">
          <div style="font-size:22px;margin-bottom:5px">✅</div>
          <div style="font-size:13px;font-weight:800;color:${C.ok}">SESSION COMPLETE</div>
          <div style="font-size:11px;color:${C.muted};margin-top:3px">${(S.prog[sdKey]||{}).date||''}</div>
          <button onclick="unmark(${w},'${d}')" style="margin-top:10px;background:none;border:1px solid ${C.faint};border-radius:8px;padding:5px 14px;color:${C.muted};font-size:10px;cursor:pointer">Undo</button>
        </div>`}
    </div>
    ${navHTML()}
    ${S.showReset?`<div class="modal-bg"><div class="modal" style="border:1px solid ${C.danger}44">
      <div style="font-size:16px;font-weight:900;color:${C.danger};margin-bottom:8px">Reset Session?</div>
      <div style="font-size:12px;color:${C.muted};line-height:1.6;margin-bottom:18px">Clears all checks, weights, reps, and notes for <strong style="color:${C.text}">Week ${w} · Day ${d}</strong>. Cannot be undone.</div>
      <div style="display:flex;gap:10px">
        <button onclick="cancelReset()" style="flex:1;padding:12px;background:${C.faint};border:none;border-radius:10px;color:${C.text};font-size:12px;font-weight:600;cursor:pointer">Cancel</button>
        <button onclick="resetSession(${w},'${d}')" style="flex:1;padding:12px;background:${C.danger};border:none;border-radius:10px;color:#fff;font-size:12px;font-weight:800;cursor:pointer">🔄 Reset</button>
      </div>
    </div></div>`:''}
    ${S.toast?`<div class="toast">${S.toast}</div>`:''}
  </div>`;
  document.getElementById('app').innerHTML=html;
}

// ── MAIN RENDER ───────────────────────────────────────────────────
function render(){
  if(S.view==='session')renderSession();
  else document.getElementById('app').innerHTML=S.view==='prog'?renderProg():renderDash();
}

try{load();}catch(e){console.error('load error',e);}
try{render();}catch(e){
  document.getElementById('app').innerHTML='<div style="color:#FF6B35;padding:20px;font-size:12px;line-height:1.8"><b>Runtime Error:</b><br>'+e.message+'<br><br><pre style="font-size:10px;overflow:auto">'+e.stack+'</pre></div>';
}
</script>
</body>
</html>
